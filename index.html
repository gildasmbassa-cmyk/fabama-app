.login-above{text-align:center;margin-bottom:10px;animation:fadeSlideDown .5s ease both}
.logo-ring{
  width:90px;height:90px;border-radius:50%;
  background:#fff;
  box-shadow:0 0 0 4px rgba(200,162,28,0.9),0 0 0 8px rgba(200,162,28,0.3),0 0 32px rgba(200,162,28,0.5),0 8px 32px rgba(0,0,0,0.5);
  margin:0 auto 14px;display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.logo-ring img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.login-above h1{font-size:32px;font-weight:800;color:#fff;letter-spacing:3px;margin:0;text-shadow:0 2px 16px rgba(0,0,0,0.4)}
.login-tagline{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:7px}
.login-tagline span{font-size:13.5px;color:rgba(200,162,28,0.95);font-weight:500;letter-spacing:0.5px}
.login-tagline::before,.login-tagline::after{content:'•';color:rgba(200,162,28,0.5);font-size:9px}
.login-card{
  background:#fff;border-radius:22px;padding:20px 20px 18px;
  width:100%;max-width:410px;
  box-shadow:0 28px 72px rgba(0,0,0,0.38),0 0 0 1px rgba(255,255,255,0.08);
  animation:fadeSlideUp .5s .12s ease both;
}
.login-card-top{text-align:center;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid #f0f4f0}
.user-icon-wrap{width:44px;height:44px;background:var(--green);border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;box-shadow:0 4px 16px rgba(46,107,46,0.4);font-size:20px}
.login-card-top h2{font-size:21px;font-weight:700;color:#111;margin:0 0 6px}
.login-card-top p{font-size:13.5px;color:#666;margin:0;line-height:1.5}
.login-card-top p strong{color:var(--green)}
.form-group{margin-bottom:15px}
.form-group label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:7px}
.input-wrap{position:relative}
.input-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#9ca3af;font-size:15px;pointer-events:none}
.form-group input{width:100%;padding:13px 42px;border:1.5px solid #e5e7eb;border-radius:11px;font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s;background:#fafafa;box-sizing:border-box}
.form-group input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(46,107,46,0.1);background:#fff}
.pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#9ca3af;font-size:15px;padding:4px;transition:color .15s}
.pw-toggle:hover{color:var(--green)}
.login-extras{display:flex;align-items:center;justify-content:space-between;margin:4px 0 18px;font-size:13px}
.remember-wrap{display:flex;align-items:center;gap:7px;cursor:pointer;color:#4b5563;font-weight:500;user-select:none}
.remember-wrap input[type=checkbox]{width:16px;height:16px;accent-color:var(--green);cursor:pointer}
.forgot-btn{color:var(--green);font-weight:600;font-size:13px;background:none;border:none;cursor:pointer;padding:0}
.forgot-btn:hover{text-decoration:underline}
.btn-login{
  width:100%;padding:15px;
  background:linear-gradient(135deg,#2a6129,#173d17);
  color:#fff;border:none;border-radius:13px;
  font-size:15px;font-weight:700;cursor:pointer;
  transition:all .2s;display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 4px 18px rgba(46,107,46,0.45);letter-spacing:0.4px;
}
.btn-login:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 24px rgba(46,107,46,0.5);background:linear-gradient(135deg,#336b30,#1d4a1d)}
.btn-login:active:not(:disabled){transform:translateY(0)}
.btn-login:disabled{background:#bbb;cursor:not-allowed;box-shadow:none}
.login-secure{text-align:center;margin-top:14px;font-size:12px;color:#aaa;display:flex;align-items:center;justify-content:center;gap:5px}
.login-error{color:var(--red);font-size:13px;margin-top:12px;text-align:center;padding:10px 14px;background:#fff5f5;border-radius:9px;border:1px solid #fcc}
.login-footer{text-align:center;margin-top:20px;animation:fadeSlideUp .5s .25s ease both}
.login-footer p{font-size:11.5px;color:rgba(255,255,255,0.45);margin:3px 0}

/* OFFLINE BANNER */
.offline-banner{background:var(--orange);color:#fff;text-align:center;padding:8px;font-size:13px;font-weight:600;position:sticky;top:0;z-index:1000}

/* HEADER */
.app-header{background:var(--green);color:#fff;padding:0 16px;display:flex;align-items:center;gap:12px;height:56px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.2)}
.app-header .logo-text{font-size:20px;font-weight:900;letter-spacing:2px;color:var(--gold)}
.app-header .subtitle{font-size:11px;opacity:.8;margin-left:2px}
.app-header .user-info{margin-left:auto;font-size:12px;opacity:.8;display:flex;align-items:center;gap:8px}
.btn-logout{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;padding:5px 10px;border-radius:6px;font-size:12px;cursor:pointer}
.btn-logout:hover{background:rgba(255,255,255,0.25)}

/* TABS */
.tabs-nav{background:var(--white);border-bottom:2px solid var(--border);overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
.tabs-nav::-webkit-scrollbar{height:3px}
.tabs-nav::-webkit-scrollbar-thumb{background:var(--green)}
.tab-btn{display:inline-block;padding:12px 16px;font-size:13px;font-weight:600;color:var(--muted);border:none;background:none;cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;white-space:nowrap}
.tab-btn:hover{color:var(--green);background:var(--green-light)}
.tab-btn.active{color:var(--green);border-bottom-color:var(--green);background:var(--green-light)}
.tab-btn.ai-tab{color:#3d7fff}
.tab-btn.ai-tab.active{color:#3d7fff;border-bottom-color:#3d7fff;background:#f0f4ff}

/* CONTENT */
.tab-content{padding:16px;max-width:1200px;margin:0 auto}

/* CARDS */
.card{background:var(--white);border-radius:12px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.card-title{font-size:16px;font-weight:700;color:var(--green);margin-bottom:16px;display:flex;align-items:center;gap:8px}

/* STATS GRID */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:var(--white);border-radius:10px;padding:16px;text-align:center;box-shadow:var(--shadow);border-left:4px solid var(--green)}
.stat-card.gold{border-left-color:var(--gold)}
.stat-card.red{border-left-color:var(--red)}
.stat-card.blue{border-left-color:#2980b9}
.stat-val{font-size:20px;font-weight:800;color:var(--green);line-height:1.2}
.stat-card.gold .stat-val{color:var(--gold)}
.stat-card.red .stat-val{color:var(--red)}
.stat-card.blue .stat-val{color:#2980b9}
.stat-label{font-size:11px;color:var(--muted);margin-top:4px}

/* TABLE */
.table-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--green);color:#fff;padding:10px 12px;text-align:left;font-weight:600;font-size:12px;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--green-light)}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.badge.ok{background:#e8f5e8;color:#2E6B2E}
.badge.warn{background:#fff3cd;color:#856404}
.badge.danger{background:#fde;color:var(--red)}
.badge.info{background:#e8f0fe;color:#1a73e8}

/* BUTTONS */
.btn{padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .2s}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:var(--green2)}
.btn-secondary{background:var(--border);color:var(--text)}
.btn-secondary:hover{background:#c0ccc0}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-danger{background:var(--red);color:#fff}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:500;padding:16px}
.modal{background:var(--white);border-radius:14px;padding:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.modal h3{font-size:18px;font-weight:700;color:var(--green);margin-bottom:20px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:7px;font-size:14px;outline:none;transition:border-color .2s;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

/* ALERT */

// ─── TABLEAU DE BORD ──────────────────────────────────────────────────────────
function TabDashboard({data,setActiveTab}){
  const {reunions=[],membres=[],prets=[]}=data;

  // ── Calculs réels ──
  const bilansStatic=[
    {mois:1,date_reunion:'30/01/2026',total_entrees:287500,total_sorties:225500,solde_mois:62000,beneficiaire_tontine:'MABENG RUBEN'},
    {mois:2,date_reunion:'28/02/2026',total_entrees:242000,total_sorties:194000,solde_mois:48000,beneficiaire_tontine:'BASSA OSEE'},
    {mois:3,date_reunion:'28/03/2026',total_entrees:274000,total_sorties:262000,solde_mois:12000,beneficiaire_tontine:'Mtre KIKI'},
    {mois:4,date_reunion:'02/05/2026',total_entrees:289000,total_sorties:206000,solde_mois:83000,beneficiaire_tontine:'BIDJANG ERIC'},
    {mois:5,date_reunion:'30/05/2026',total_entrees:297500,total_sorties:227000,solde_mois:70500,beneficiaire_tontine:'BIABACK JC'},
    {mois:6,date_reunion:'26/06/2026',total_entrees:382000,total_sorties:242000,solde_mois:140000,beneficiaire_tontine:'BASSA OSEE'},
    {mois:7,date_reunion:'01/08/2026',total_entrees:377000,total_sorties:364000,solde_mois:13000,beneficiaire_tontine:'Mme BITCHEM'},
  ];
  const liste=(reunions.length>0&&reunions.some(r=>r.total_entrees>0))?reunions:bilansStatic;
  const totalEntrees=liste.reduce((s,r)=>s+(r.total_entrees||0),0);
  const totalSorties=liste.reduce((s,r)=>s+(r.total_sorties||0),0);
  const solde=totalEntrees-totalSorties;
  const reunionsTenues=liste.filter(r=>r.date_reunion).length;
  const membresActifs=membres.length>0?membres.filter(m=>m.statut==='actif').length||membres.length:19;
  const impayes=167600; // reports 2025 confirmés
  const pretsEnRetard=prets.length>0?prets.filter(p=>p.statut==='retard').length:4;

  // ── Prochaine réunion (mois suivant le dernier tenu) ──
  const prochainMois=reunionsTenues+1;
  const prochainNom=MOIS[prochainMois]||'—';

  // ── Graphique données réelles ──
  const maxE=Math.max(...liste.map(r=>r.total_entrees||0),1);
  const maxS=Math.max(...liste.map(r=>r.total_sorties||0),1);
  const maxVal=Math.max(maxE,maxS);

  // ── Date ──
  const today=new Date();
  const dateStr=today.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

  return(
    <div className="tab-content">

      {/* Salutation */}
      <div className="dash-greeting">
        <h2>Bonjour, Gildas 👋</h2>
        <p>Voici la situation financière de votre tontine</p>
        <div className="dash-date">{dateStr}</div>
      </div>

      {/* Hero Solde */}
      <div className="hero-card">
        <div className="hero-label">Solde disponible</div>
        <div className="hero-amount">{fmt(solde)}</div>
        <div className="hero-sub">FCFA · Tontine FABAMA 2026</div>
        <div className="hero-row">
          <div className="hero-item">
            <div className="hero-item-label">↑ Entrées</div>
            <div className="hero-item-val green">{fmt(totalEntrees)}</div>
          </div>
          <div className="hero-item">
            <div className="hero-item-label">↓ Sorties</div>
            <div className="hero-item-val red">{fmt(totalSorties)}</div>
          </div>
          <div className="hero-item">
            <div className="hero-item-label">Réunions</div>
            <div className="hero-item-val">{reunionsTenues}/12</div>
          </div>
        </div>
        <button className="hero-cta" onClick={()=>setActiveTab('reunions')}>Voir les mouvements →</button>
      </div>

      {/* KPI */}
      <div className="kpi-grid">
        <div className="kpi-card" onClick={()=>setActiveTab('membres')} style={{cursor:'pointer'}}>
          <span className="kpi-icon">👥</span>
          <div className="kpi-val green">{membresActifs}</div>
          <div className="kpi-desc">Membres actifs</div>
        </div>
        <div className="kpi-card" onClick={()=>setActiveTab('tontine')} style={{cursor:'pointer'}}>
          <span className="kpi-icon">🏦</span>
          <div className="kpi-val green">120 000</div>
          <div className="kpi-desc">FCFA pot mensuel</div>
        </div>
        <div className="kpi-card" onClick={()=>setActiveTab('prets')} style={{cursor:'pointer'}}>
          <span className="kpi-icon">⚠️</span>
          <div className="kpi-val red">{pretsEnRetard}</div>
          <div className="kpi-desc">Prêts en retard</div>
        </div>
        <div className="kpi-card" onClick={()=>setActiveTab('reports')} style={{cursor:'pointer'}}>
          <span className="kpi-icon">💸</span>
          <div className="kpi-val gold">{fmt(impayes)}</div>
          <div className="kpi-desc">FCFA impayés 2025</div>
        </div>
      </div>

      {/* À surveiller */}
      <div className="section-header">
        <span className="section-title">À surveiller</span>
        <button className="section-link" onClick={()=>setActiveTab('prets')}>Voir tout →</button>
      </div>
      <div className="alert-card">
        <div className="alert-item">
          <div className="alert-dot red"/>
          <div className="alert-info">
            <div className="alert-info-title">Reports impayés 2025</div>
            <div className="alert-info-sub">BIDIAS Ibrahim · KINDIM II</div>
          </div>
          <div className="alert-amount">{fmt(impayes)} F</div>
        </div>
        <div className="alert-item">
          <div className="alert-dot red"/>
          <div className="alert-info">
            <div className="alert-info-title">BASSA OSEE — retard 4 mois</div>
            <div className="alert-info-sub">Crédit ordinaire + obligatoire</div>
          </div>
          <div className="alert-amount">111 870 F</div>
        </div>
        <div className="alert-item">
          <div className="alert-dot gold"/>
          <div className="alert-info">
            <div className="alert-info-title">Rang tontine n°7 — Juillet</div>
            <div className="alert-info-sub">Bénéficiaire : Mme BITCHEM</div>
          </div>
          <div style={{fontSize:12,color:'var(--gold)',fontWeight:700}}>À encaisser</div>
        </div>
      </div>

      {/* Prochaine réunion */}
      <div className="section-header">
        <span className="section-title">Prochaine réunion</span>
        <button className="section-link" onClick={()=>setActiveTab('reunions')}>Toutes →</button>
      </div>
      <div className="next-meeting">
        <div className="next-meeting-badge">
          <div className="next-meeting-month">{prochainNom?.slice(0,3)}</div>
          <div className="next-meeting-day">—</div>
        </div>
        <div className="next-meeting-info">
          <div className="next-meeting-title">AG {prochainNom} 2026</div>
          <div className="next-meeting-sub">Famille hôte : MBASSA MBASSA André Gildas</div>
          <div className="next-meeting-tag">⏳ Date à confirmer</div>
        </div>
      </div>

      {/* Graphique activité */}
      <div className="section-header">
        <span className="section-title">Activité financière 2026</span>
      </div>
      <div className="chart-card">
        <div className="chart-legend">
          <div className="legend-item"><div className="legend-dot" style={{background:'var(--green)'}}/>Entrées</div>
          <div className="legend-item"><div className="legend-dot" style={{background:'rgba(192,57,43,0.5)'}}/>Sorties</div>
        </div>
        <div className="chart-bars">
          {liste.map((r,i)=>{
            const hIn=Math.round((r.total_entrees/maxVal)*65)||2;
            const hOut=Math.round((r.total_sorties/maxVal)*65)||2;
            return(
              <div key={i} className="bar-group">
                <div className="bar-wrap">
                  <div className="bar in" style={{height:hIn+'px'}}/>
                  <div className="bar out" style={{height:hOut+'px'}}/>
                </div>
                <div className="bar-month">{MOIS[r.mois]?.slice(0,3)}</div>
              </div>
            );
          })}
        </div>
        <div style={{display:'flex',justifyContent:'space-between',marginTop:8,paddingTop:10,borderTop:'1px solid var(--border)'}}>
          <div style={{fontSize:12,color:'var(--muted)'}}>Bilan S1 2026</div>
          <div style={{fontSize:14,fontWeight:800,color:'var(--green)'}}>{fmt(solde)} FCFA</div>
        </div>
      </div>

    </div>
  );
}

  const QUICKIES=[
    {label:'💰 Solde caisse',q:'Quel est le solde actuel de la caisse FABAMA ?'},
    {label:'🚨 Prêts en retard',q:'Qui a des prêts en retard de remboursement ?'},

    {label:'📋 Absents juin',q:'Quels membres n\'ont pas cotisé en juin 2026 ?'},
  ];

    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/`(.*?)`/g,'<code>$1</code>')
    .replace(/\n\n/g,'</p><p>')
    .replace(/\n/g,'<br>');

    const q=text.trim();
    if(!q||loading)return;
    setInput('');
    if(taRef.current)taRef.current.style.height='auto';
    const newMsgs=[...messages,{role:'user',content:q}];
    setMessages(newMsgs);
    setLoading(true);
    try{
      const r=await fetch('https://qygjxmgfmfnquxvszzqy.supabase.co/functions/v1/claude-proxy',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,system:AI_SYSTEM,messages:newMsgs})
      });
      const d=await r.json();
      const reply=d.content?.[0]?.text||'Erreur : réponse vide.';
      setMessages([...newMsgs,{role:'assistant',content:reply}]);
    }catch(e){
      setMessages([...newMsgs,{role:'assistant',content:'🚨 Erreur de connexion. Vérifie ta connexion internet.'}]);
    }
    setLoading(false);
  };

  return(
    <div className="tab-content">
      <div className="ai-header">
        <div className="ai-logo">SG</div>
        <div>
          <h2>Assistant Secrétaire Général</h2>
          <p>Pose tes questions sur les finances, membres, prêts et tontine FABAMA 2026</p>
        </div>
        <div className="ai-status"><div className="ai-dot"/>En ligne</div>
      </div>

      <div className="ai-quickbar">
        {QUICKIES.map((q,i)=>(
          <button key={i} className="ai-chip" onClick={()=>send(q.q)}>{q.label}</button>
        ))}
      </div>

      <div className="ai-chat">
        <div className="ai-messages" ref={chatRef}>
          {messages.length===0&&(
            <div style={{textAlign:'center',padding:'30px 20px',color:'var(--muted)'}}>
              <div style={{fontSize:32,marginBottom:8}}>🤖</div>
              <p style={{fontSize:13}}>Bonjour Gildas. Je connais toutes les données FABAMA janv–juin 2026.<br/>Posez votre question ou utilisez les raccourcis ci-dessus.</p>
            </div>
          )}
          {messages.map((m,i)=>(
            <div key={i} className={`ai-msg ${m.role}`}>
              <div className="ai-avatar">{m.role==='user'?'SG':'AI'}</div>
              <div className="ai-bubble">
                {m.role==='assistant'
                  ?<p dangerouslySetInnerHTML={{__html:renderMarkdown(m.content)}}/>
                  :m.content
                }
              </div>
            </div>
          ))}
          {loading&&(
            <div className="ai-msg assistant">
              <div className="ai-avatar">AI</div>
              <div className="thinking">Analyse… <div className="thinking-dots"><span/><span/><span/></div></div>
            </div>
          )}
        </div>
        <div className="ai-inputbar">
          <div className="ai-inputwrap">
            <textarea
              ref={taRef}
              value={input}
              onChange={e=>{setInput(e.target.value);e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,100)+'px'}}
              onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}}}
              placeholder="Posez votre question…"
              rows={1}
            />
          </div>
          <button className="ai-send" onClick={()=>send()} disabled={!input.trim()||loading}>
            <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── APP PRINCIPALE ───────────────────────────────────────────────────────────
function App(){
  const [auth,setAuth]=useState(null);
  const [role,setRole]=useState(null);
  const [activeTab,setActiveTab]=useState('dashboard');
  const [data,setData]=useState({membres:[],reunions:[],tontine:[],prets:[],cotisations:[],synthese:[]});
  const [loading,setLoading]=useState(true);
  const [offline,setOffline]=useState(!navigator.onLine);

  useEffect(()=>{
    const on=()=>setOffline(false);const off=()=>setOffline(true);
    window.addEventListener('online',on);window.addEventListener('offline',off);
    return()=>{window.removeEventListener('online',on);window.removeEventListener('offline',off)};
  },[]);

  useEffect(()=>{
    supa.auth.getUser().then(({data:d})=>{
      if(d?.user){setAuth(d.user);loadData(d.user);}
      else setLoading(false);
    });
  },[]);

  const loadData=async(user)=>{
    setLoading(true);
    try{
      const [m,r,t,p,cots]=await Promise.all([
        supaFetch('/rest/v1/membres?select=*&order=nom.asc').catch(()=>[]),
        supaFetch('/rest/v1/reunions?select=*&annee=eq.2026&order=mois.asc').catch(()=>[]),
        supaFetch('/rest/v1/tontine?select=*&annee=eq.2026&order=rang.asc').catch(()=>[]),
        supaFetch('/rest/v1/prets?select=*&annee=eq.2026').catch(()=>[]),
        supaFetch('/rest/v1/cotisations?select=mois,epargne,loto,tontine_versee,remboursement,interets,emprunt,aide,frais_collation,total,membres(nom)&annee=eq.2026&order=mois.asc').catch(()=>[]),
      ]);
      // Normaliser cotisations : ajouter membre_nom depuis le join
      const cotsNorm=(cots||[]).map(c=>({...c,membre_nom:c.membres?.nom||''}));
      // get role
      const bureau=await supaFetch(`/rest/v1/bureau?select=role&user_id=eq.${_userId}`).catch(()=>[]);
      setRole(bureau?.[0]?.role||'membre');
      setData({membres:m||[],reunions:r||[],tontine:t||[],prets:p||[],cotisations:cotsNorm,synthese:[]});
    }catch(e){console.error(e)}
    setLoading(false);
  };

  const login=()=>{supa.auth.getUser().then(({data:d})=>{if(d?.user){setAuth(d.user);loadData(d.user);}})};
  const logout=()=>{supa.auth.signOut();setAuth(null);setRole(null)};

  // ── Hooks supplémentaires (avant tout return conditionnel) ──
  const [showUserMenu,setShowUserMenu]=useState(false);
  const [showMore,setShowMore]=useState(false);

  if(!auth)return <Login onLogin={login}/>;

  const impayes167k=true;

  const TABS=[
    {id:'dashboard',label:'📊 Tableau de bord'},
    {id:'membres',label:'👥 Membres'},
    {id:'tontine',label:'🏦 Tontine'},
    {id:'prets',label:'💰 Prêts'},
    {id:'reunions',label:'📅 Réunions'},
    {id:'detail',label:'📋 Détail AG'},
    {id:'synthese',label:'📈 Synthèse'},
    {id:'reports',label:'⚠️ Reports 2025'},
    {id:'reception',label:'🏠 Réception'},
    {id:'communique',label:'📢 Communiqué'},
    {id:'assistant',label:'🤖 Assistant IA',ai:true},
  ];

  const BNAV=[
    {id:'dashboard',icon:'🏠',label:'Accueil'},
    {id:'membres',icon:'👥',label:'Membres'},
    {id:'prets',icon:'💰',label:'Finances'},
    {id:'reunions',icon:'📅',label:'Réunions'},
    {id:'more',icon:'⋯',label:'Plus'},
  ];
  const MORE_TABS=TABS.filter(t=>!['dashboard','membres','prets','reunions'].includes(t.id));

  const initiales=(_userEmail||'SG').split('@')[0].slice(0,2).toUpperCase();

  return(
    <>
      <div className="app-shell">
      {offline&&<div className="offline-banner">📡 Mode hors ligne — données non synchronisées</div>}

      {/* ── Header compact ── */}
      <header className="app-header">
        <div>
          <div className="logo-text">FABAMA</div>
          <span className="subtitle">Gestion Financière 2026</span>
        </div>
        <div className="header-right">
          {impayes167k&&<div className="header-icon" title="Alertes" onClick={()=>setActiveTab('reports')}>🔔</div>}
          <div className="header-avatar" onClick={()=>setShowUserMenu(!showUserMenu)}>
            {initiales}
            <div className={`user-dropdown${showUserMenu?' open':''}`}>
              <p>{_userEmail}</p>
              <button onClick={()=>{setShowUserMenu(false);logout()}}>🚪 Déconnexion</button>
            </div>
          </div>
        </div>
      </header>

      {/* ── Tabs desktop ── */}
      <nav className="tabs-nav">
        {TABS.map(t=>(
          <button key={t.id} className={`tab-btn${activeTab===t.id?' active':''}${t.ai?' ai-tab':''}`} onClick={()=>setActiveTab(t.id)}>{t.label}</button>
        ))}
      </nav>

      {/* ── Contenu scrollable ── */}
      <main className="app-main">
      {loading?<Loading/>:(
        <>
          {activeTab==='dashboard'&&<TabDashboard data={data} setActiveTab={setActiveTab}/>}
          {activeTab==='membres'&&<TabMembres data={data} role={role}/>}
          {activeTab==='tontine'&&<TabTontine data={data}/>}
          {activeTab==='prets'&&<TabPrets data={data}/>}
          {activeTab==='reunions'&&<TabReunions data={data}/>}
          {activeTab==='detail'&&<TabDetailAG data={data}/>}
          {activeTab==='synthese'&&<TabSynthese data={data}/>}
          {activeTab==='reports'&&<TabReports/>}
          {activeTab==='reception'&&<TabReception/>}
          {activeTab==='communique'&&<TabCommunique data={data}/>}
          {activeTab==='assistant'&&<TabAssistant/>}
        </>
      )}
      </main>

      {/* ── Bottom nav mobile ── */}
      <nav className="bottom-nav">
        <div className="bottom-nav-items">
          {BNAV.map(b=>(
            b.id==='more'
              ?<button key="more" className={`bnav-btn${showMore?' active':''}`} onClick={()=>setShowMore(!showMore)}>
                  <span className="bnav-icon">{b.icon}</span>
                  <span className="bnav-label">{b.label}</span>
                </button>
              :<button key={b.id} className={`bnav-btn${activeTab===b.id?' active':''}`} onClick={()=>{setActiveTab(b.id);setShowMore(false)}}>
                  <span className="bnav-icon">{b.icon}</span>
                  <span className="bnav-label">{b.label}</span>
                  {b.id==='prets'&&<span className="bnav-indicator"/>}
                </button>
          ))}
        </div>
        {showMore&&(
          <div style={{background:'#fff',borderTop:'1px solid var(--border)',padding:'8px 12px',display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:6}}>
            {MORE_TABS.map(t=>(
              <button key={t.id} onClick={()=>{setActiveTab(t.id);setShowMore(false)}} style={{background:activeTab===t.id?'var(--green-light)':'#f5f5f5',border:'none',borderRadius:8,padding:'8px 4px',fontSize:10,fontWeight:600,color:activeTab===t.id?'var(--green)':'var(--muted)',cursor:'pointer',textAlign:'center',lineHeight:1.4}}>
                {t.label}
              </button>
            ))}
          </div>
        )}
      </nav>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script>
// ── PWA : Service Worker + auto-update ──
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js').then(reg=>{
      // Vérifier les mises à jour toutes les 60s
      setInterval(()=>reg.update(),60000);
      reg.addEventListener('updatefound',()=>{
        const nw=reg.installing;
        nw.addEventListener('statechange',()=>{
          if(nw.state==='installed'&&navigator.serviceWorker.controller){
            // Nouvelle version disponible
            const banner=document.createElement('div');
            banner.style.cssText='position:fixed;bottom:70px;left:12px;right:12px;background:#2E6B2E;color:#fff;padding:14px 16px;border-radius:12px;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;align-items:center;gap:12px;font-family:system-ui,sans-serif;font-size:14px';
            banner.innerHTML='<span style="flex:1">🔄 Nouvelle version disponible</span><button style="background:#C8A21C;border:none;color:#1a2e1a;padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px">Mettre à jour</button>';
            banner.querySelector('button').onclick=()=>{nw.postMessage({type:'SKIP_WAITING'});location.reload()};
            document.body.appendChild(banner);
          }
        });
      });
    }).catch(e=>console.log('SW registration failed:',e));
  });
  // Recharger quand le nouveau SW prend le contrôle
  let refreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!refreshing){refreshing=true;location.reload()}
  });
}

// ── Bouton d'installation PWA ──
let deferredPrompt;
window.addEventListener('beforeinstallprompt',(e)=>{
  e.preventDefault();
  deferredPrompt=e;
  const btn=document.createElement('div');
  btn.id='pwa-install';
  btn.style.cssText='position:fixed;bottom:70px;left:12px;right:12px;background:#2E6B2E;color:#fff;padding:14px 16px;border-radius:12px;z-index:9998;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;align-items:center;gap:12px;font-family:system-ui,sans-serif;font-size:14px';
  btn.innerHTML='<span style="flex:1">📱 Installer FABAMA sur votre téléphone</span><button style="background:#C8A21C;border:none;color:#1a2e1a;padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px">Installer</button><button style="background:none;border:none;color:rgba(255,255,255,.6);font-size:20px;cursor:pointer;padding:0 4px">×</button>';
  const [install,close]=btn.querySelectorAll('button');
  install.onclick=async()=>{
    btn.remove();
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt=null;
  };
  close.onclick=()=>btn.remove();
  document.body.appendChild(btn);
});
</script>
