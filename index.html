<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FABAMA">
<meta name="theme-color" content="#2E6B2E">
<link rel="manifest" href="/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>FABAMA — Gestion Financière</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f0;color:#1a2e1a;min-height:100vh;min-height:100dvh}
#root{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.app-shell{display:flex;flex-direction:column;flex:1;overflow:hidden}
.app-main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
:root{
  --green:#2E6B2E;--green2:#4a9a4a;--green-light:#e8f5e8;
  --gold:#C8A21C;--gold-light:#fdf8e8;
  --red:#c0392b;--orange:#e67e22;
  --bg:#f0f4f0;--white:#fff;--border:#d0ddd0;
  --text:#1a2e1a;--muted:#5a7a5a;--shadow:0 2px 8px rgba(0,0,0,0.1);
}

/* LOGIN */
@keyframes fadeSlideDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.login-screen{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow-y:auto;
  background-image:url("/assets/fond.webp");background-size:cover;background-position:center top;
  padding:56px 16px 32px;
}
.login-above{text-align:center;margin-bottom:10px;animation:fadeSlideDown .5s ease both}
.logo-ring{
  width:90px;height:90px;border-radius:50%;
  background:#fff;
  box-shadow:0 0 0 4px rgba(200,162,28,0.9),0 0 0 8px rgba(200,162,28,0.3),0 0 32px rgba(200,162,28,0.5),0 8px 32px rgba(0,0,0,0.5);
  margin:0 auto 14px;display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.logo-ring img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.login-above h1{font-size:32px;font-weight:800;color:#fff;letter-spacing:3px;margin:0;text-shadow:0 2px 16px rgba(0,0,0,0.4)}
.login-tagline{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:7px}
.login-tagline span{font-size:13.5px;color:rgba(200,162,28,0.95);font-weight:500;letter-spacing:0.5px}
.login-tagline::before,.login-tagline::after{content:'•';color:rgba(200,162,28,0.5);font-size:9px}
.login-card{
  background:#fff;border-radius:22px;padding:20px 20px 18px;
  width:100%;max-width:410px;
  box-shadow:0 28px 72px rgba(0,0,0,0.38),0 0 0 1px rgba(255,255,255,0.08);
  animation:fadeSlideUp .5s .12s ease both;
}
.login-card-top{text-align:center;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid #f0f4f0}
.user-icon-wrap{width:44px;height:44px;background:var(--green);border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;box-shadow:0 4px 16px rgba(46,107,46,0.4);font-size:20px}
.login-card-top h2{font-size:21px;font-weight:700;color:#111;margin:0 0 6px}
.login-card-top p{font-size:13.5px;color:#666;margin:0;line-height:1.5}
.login-card-top p strong{color:var(--green)}
.form-group{margin-bottom:15px}
.form-group label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:7px}
.input-wrap{position:relative}
.input-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#9ca3af;font-size:15px;pointer-events:none}
.form-group input{width:100%;padding:13px 42px;border:1.5px solid #e5e7eb;border-radius:11px;font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s;background:#fafafa;box-sizing:border-box}
.form-group input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(46,107,46,0.1);background:#fff}
.pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#9ca3af;font-size:15px;padding:4px;transition:color .15s}
.pw-toggle:hover{color:var(--green)}
.login-extras{display:flex;align-items:center;justify-content:space-between;margin:4px 0 18px;font-size:13px}
.remember-wrap{display:flex;align-items:center;gap:7px;cursor:pointer;color:#4b5563;font-weight:500;user-select:none}
.remember-wrap input[type=checkbox]{width:16px;height:16px;accent-color:var(--green);cursor:pointer}
.forgot-btn{color:var(--green);font-weight:600;font-size:13px;background:none;border:none;cursor:pointer;padding:0}
.forgot-btn:hover{text-decoration:underline}
.btn-login{
  width:100%;padding:15px;
  background:linear-gradient(135deg,#2a6129,#173d17);
  color:#fff;border:none;border-radius:13px;
  font-size:15px;font-weight:700;cursor:pointer;
  transition:all .2s;display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 4px 18px rgba(46,107,46,0.45);letter-spacing:0.4px;
}
.btn-login:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 24px rgba(46,107,46,0.5);background:linear-gradient(135deg,#336b30,#1d4a1d)}
.btn-login:active:not(:disabled){transform:translateY(0)}
.btn-login:disabled{background:#bbb;cursor:not-allowed;box-shadow:none}
.login-secure{text-align:center;margin-top:14px;font-size:12px;color:#aaa;display:flex;align-items:center;justify-content:center;gap:5px}
.login-error{color:var(--red);font-size:13px;margin-top:12px;text-align:center;padding:10px 14px;background:#fff5f5;border-radius:9px;border:1px solid #fcc}
.login-footer{text-align:center;margin-top:20px;animation:fadeSlideUp .5s .25s ease both}
.login-footer p{font-size:11.5px;color:rgba(255,255,255,0.45);margin:3px 0}

/* OFFLINE BANNER */
.offline-banner{background:var(--orange);color:#fff;text-align:center;padding:8px;font-size:13px;font-weight:600;position:sticky;top:0;z-index:1000}

/* HEADER */
.app-header{background:var(--green);color:#fff;padding:0 16px;display:flex;align-items:center;gap:12px;height:56px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.2)}
.app-header .logo-text{font-size:20px;font-weight:900;letter-spacing:2px;color:var(--gold)}
.app-header .subtitle{font-size:11px;opacity:.8;margin-left:2px}
.app-header .user-info{margin-left:auto;font-size:12px;opacity:.8;display:flex;align-items:center;gap:8px}
.btn-logout{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;padding:5px 10px;border-radius:6px;font-size:12px;cursor:pointer}
.btn-logout:hover{background:rgba(255,255,255,0.25)}

/* TABS */
.tabs-nav{background:var(--white);border-bottom:2px solid var(--border);overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
.tabs-nav::-webkit-scrollbar{height:3px}
.tabs-nav::-webkit-scrollbar-thumb{background:var(--green)}
.tab-btn{display:inline-block;padding:12px 16px;font-size:13px;font-weight:600;color:var(--muted);border:none;background:none;cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;white-space:nowrap}
.tab-btn:hover{color:var(--green);background:var(--green-light)}
.tab-btn.active{color:var(--green);border-bottom-color:var(--green);background:var(--green-light)}
.tab-btn.ai-tab{color:#3d7fff}
.tab-btn.ai-tab.active{color:#3d7fff;border-bottom-color:#3d7fff;background:#f0f4ff}

/* CONTENT */
.tab-content{padding:16px;max-width:1200px;margin:0 auto}

/* CARDS */
.card{background:var(--white);border-radius:12px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.card-title{font-size:16px;font-weight:700;color:var(--green);margin-bottom:16px;display:flex;align-items:center;gap:8px}

/* STATS GRID */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:var(--white);border-radius:10px;padding:16px;text-align:center;box-shadow:var(--shadow);border-left:4px solid var(--green)}
.stat-card.gold{border-left-color:var(--gold)}
.stat-card.red{border-left-color:var(--red)}
.stat-card.blue{border-left-color:#2980b9}
.stat-val{font-size:20px;font-weight:800;color:var(--green);line-height:1.2}
.stat-card.gold .stat-val{color:var(--gold)}
.stat-card.red .stat-val{color:var(--red)}
.stat-card.blue .stat-val{color:#2980b9}
.stat-label{font-size:11px;color:var(--muted);margin-top:4px}

/* TABLE */
.table-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--green);color:#fff;padding:10px 12px;text-align:left;font-weight:600;font-size:12px;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--green-light)}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.badge.ok{background:#e8f5e8;color:#2E6B2E}
.badge.warn{background:#fff3cd;color:#856404}
.badge.danger{background:#fde;color:var(--red)}
.badge.info{background:#e8f0fe;color:#1a73e8}

/* BUTTONS */
.btn{padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .2s}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:var(--green2)}
.btn-secondary{background:var(--border);color:var(--text)}
.btn-secondary:hover{background:#c0ccc0}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-danger{background:var(--red);color:#fff}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:500;padding:16px}
.modal{background:var(--white);border-radius:14px;padding:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.modal h3{font-size:18px;font-weight:700;color:var(--green);margin-bottom:20px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:7px;font-size:14px;outline:none;transition:border-color .2s;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

/* ALERT */
.alert{padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:12px}
.alert.info{background:#e8f0fe;color:#1a73e8;border:1px solid #c5d8fb}
.alert.warn{background:var(--gold-light);color:#856404;border:1px solid #ffc}
.alert.danger{background:#fde;color:var(--red);border:1px solid #fcc}
.alert.success{background:var(--green-light);color:var(--green);border:1px solid #b8dbb8}

/* LOADING */
.loading{text-align:center;padding:40px;color:var(--muted)}
.spinner{display:inline-block;width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* COMMUNIQUÉ */
.communique-preview{background:#fffdf5;border:1px solid var(--gold);border-radius:8px;padding:20px;font-size:13px;line-height:1.8;white-space:pre-wrap;font-family:Georgia,serif}

/* AI ASSISTANT TAB */
.ai-header{background:linear-gradient(135deg,#0f1117,#181c26);color:#fff;border-radius:12px;padding:20px;margin-bottom:16px;display:flex;align-items:center;gap:14px}
.ai-logo{width:48px;height:48px;background:linear-gradient(135deg,#3d7fff,#00d4a0);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;flex-shrink:0}
.ai-header h2{font-size:18px;font-weight:700;margin-bottom:2px}
.ai-header p{font-size:12px;opacity:.7}
.ai-status{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:#00d4a0}
.ai-dot{width:7px;height:7px;background:#00d4a0;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.ai-quickbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.ai-chip{background:#fff;border:1.5px solid var(--border);color:var(--muted);font-size:12px;padding:6px 12px;border-radius:20px;cursor:pointer;transition:all .15s;font-weight:500}
.ai-chip:hover{border-color:#3d7fff;color:#3d7fff;background:#f0f4ff}

.ai-chat{background:#fff;border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;height:450px}
.ai-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.ai-messages::-webkit-scrollbar{width:4px}
.ai-messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.ai-msg{display:flex;gap:10px;max-width:100%}
.ai-msg.user{flex-direction:row-reverse;align-self:flex-end}
.ai-msg.assistant{align-self:flex-start}
.ai-avatar{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;margin-top:2px}
.ai-msg.user .ai-avatar{background:rgba(46,107,46,0.15);color:var(--green);border:1px solid rgba(46,107,46,0.3)}
.ai-msg.assistant .ai-avatar{background:rgba(61,127,255,0.1);color:#3d7fff;border:1px solid rgba(61,127,255,0.2)}
.ai-bubble{padding:10px 14px;border-radius:10px;font-size:13px;line-height:1.65;max-width:calc(100% - 48px)}
.ai-msg.user .ai-bubble{background:var(--green-light);border:1px solid #b8dbb8;border-top-right-radius:3px}
.ai-msg.assistant .ai-bubble{background:#f8faff;border:1px solid #e0e8ff;border-top-left-radius:3px}
.ai-bubble strong{color:var(--green);font-weight:600}
.ai-bubble code{background:rgba(0,0,0,0.06);padding:1px 5px;border-radius:3px;font-size:12px;font-family:monospace}

.thinking{display:flex;align-items:center;gap:6px;padding:10px 14px;background:#f8faff;border:1px solid #e0e8ff;border-radius:10px;border-top-left-radius:3px;font-size:12px;color:var(--muted)}
.thinking-dots span{display:inline-block;width:4px;height:4px;background:var(--muted);border-radius:50%;margin:0 1px;animation:bounce 1.2s infinite}
.thinking-dots span:nth-child(2){animation-delay:.2s}
.thinking-dots span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-4px);opacity:1}}

.ai-inputbar{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:flex-end}
.ai-inputwrap{flex:1;display:flex;align-items:flex-end;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:8px 12px;transition:border-color .15s}
.ai-inputwrap:focus-within{border-color:#3d7fff}
.ai-inputwrap textarea{flex:1;background:transparent;border:none;outline:none;font-size:13px;font-family:inherit;resize:none;min-height:20px;max-height:100px;color:var(--text)}
.ai-inputwrap textarea::placeholder{color:var(--muted)}
.ai-send{width:34px;height:34px;background:#3d7fff;border:none;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s}
.ai-send:hover{background:#5a8fff}
.ai-send:disabled{background:var(--border);cursor:not-allowed}
.ai-send svg{width:14px;height:14px;fill:#fff}

/* RECEPTION */
.reception-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.reception-card{background:var(--white);border-radius:10px;padding:16px;border:2px solid var(--border);transition:border-color .2s}
.reception-card.done{border-color:var(--green);background:var(--green-light)}
.reception-card.current{border-color:var(--gold);background:var(--gold-light)}
.reception-card .month{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.reception-card .host{font-size:14px;font-weight:700;color:var(--text)}
.reception-card .status{margin-top:8px}


/* ── NOUVEAU HEADER COMPACT ── */
.app-header{
  background:var(--green);color:#fff;
  padding:0 16px;display:flex;align-items:center;gap:10px;
  height:52px;position:sticky;top:0;z-index:200;
  box-shadow:0 2px 12px rgba(0,0,0,0.18);
}
.app-header .logo-text{font-size:18px;font-weight:900;letter-spacing:2px;color:var(--gold)}
.app-header .subtitle{font-size:10px;opacity:.75;margin-left:2px;display:block}
.header-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.header-icon{width:34px;height:34px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:background .15s}
.header-icon:hover{background:rgba(255,255,255,0.22)}
.header-avatar{width:34px;height:34px;background:var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#1a2e1a;cursor:pointer;position:relative}
.user-dropdown{position:absolute;top:44px;right:0;background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px;min-width:180px;box-shadow:0 8px 24px rgba(0,0,0,0.15);z-index:300;display:none}
.user-dropdown.open{display:block}
.user-dropdown p{font-size:12px;color:var(--muted);padding:4px 8px;margin-bottom:4px;border-bottom:1px solid var(--border)}
.user-dropdown button{width:100%;text-align:left;padding:8px 10px;border:none;background:none;cursor:pointer;font-size:13px;color:var(--text);border-radius:6px}
.user-dropdown button:hover{background:var(--green-light);color:var(--green)}

/* ── NAVIGATION ONGLETS (desktop top) ── */
.tabs-nav{background:var(--white);border-bottom:2px solid var(--border);overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;display:block}
.tabs-nav::-webkit-scrollbar{height:3px}
.tabs-nav::-webkit-scrollbar-thumb{background:var(--green)}
.tab-btn{display:inline-flex;align-items:center;gap:5px;padding:10px 14px;font-size:12.5px;font-weight:600;color:var(--muted);border:none;background:none;cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;white-space:nowrap}
.tab-btn:hover{color:var(--green);background:var(--green-light)}
.tab-btn.active{color:var(--green);border-bottom-color:var(--green);background:var(--green-light)}
.tab-btn.ai-tab{color:#3d7fff}
.tab-btn.ai-tab.active{color:#3d7fff;border-bottom-color:#3d7fff;background:#f0f4ff}

/* ── BOTTOM NAV MOBILE ── */
.bottom-nav{
  display:none;position:fixed;bottom:0;left:0;right:0;
  background:#fff;border-top:1px solid var(--border);
  z-index:200;padding:0;
  box-shadow:0 -4px 16px rgba(0,0,0,0.08);
  /* safe area iOS */
  padding-bottom:env(safe-area-inset-bottom,0);
}
.bottom-nav-items{display:grid;grid-template-columns:repeat(5,1fr);height:58px}
.bnav-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:none;cursor:pointer;padding:6px 2px;transition:all .15s;position:relative}
.bnav-icon{font-size:20px;line-height:1;transition:transform .2s}
.bnav-label{font-size:10px;font-weight:600;color:var(--muted);transition:color .15s}
.bnav-btn.active .bnav-label{color:var(--green)}
.bnav-btn.active .bnav-icon{transform:translateY(-2px)}
.bnav-btn.active-ai .bnav-label{color:#3d7fff}
.bnav-indicator{position:absolute;top:4px;right:22px;width:7px;height:7px;background:var(--red);border-radius:50%;border:1.5px solid #fff}

/* ── CONTENT ZONE ── */
.tab-content{padding:16px;max-width:1200px;margin:0 auto}
@media(max-width:768px){
  .tabs-nav{display:none}
  .bottom-nav{display:block}
  .tab-content{padding:12px}
  .app-main{padding-bottom:calc(70px + env(safe-area-inset-bottom,12px))}
}
@media(min-width:769px){
  .bottom-nav{display:none!important}
}

/* ── SALUTATION ── */
.dash-greeting{padding:16px 0 12px;margin-bottom:4px}
.dash-greeting h2{font-size:20px;font-weight:700;color:var(--text);margin:0 0 3px}
.dash-greeting p{font-size:13px;color:var(--muted);margin:0}
.dash-date{font-size:12px;color:var(--muted);margin-top:2px;font-style:italic}

/* ── HERO SOLDE ── */
.hero-card{
  background:linear-gradient(135deg,#1a4a1a 0%,#2E6B2E 60%,#3a7a3a 100%);
  border-radius:16px;padding:24px 20px;margin-bottom:14px;
  box-shadow:0 8px 24px rgba(46,107,46,0.35);position:relative;overflow:hidden;
}
.hero-card::before{
  content:'';position:absolute;top:-30px;right:-30px;
  width:160px;height:160px;border-radius:50%;
  background:rgba(255,255,255,0.04);pointer-events:none;
}
.hero-card::after{
  content:'';position:absolute;bottom:-50px;left:-20px;
  width:200px;height:200px;border-radius:50%;
  background:rgba(255,255,255,0.03);pointer-events:none;
}
.hero-label{font-size:11px;font-weight:700;letter-spacing:1.5px;color:rgba(255,255,255,0.65);text-transform:uppercase;margin-bottom:8px}
.hero-amount{font-size:36px;font-weight:900;color:#fff;letter-spacing:-0.5px;line-height:1;margin-bottom:4px}
.hero-sub{font-size:12px;color:rgba(255,255,255,0.55);margin-bottom:20px}
.hero-row{display:flex;gap:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.12)}
.hero-item{flex:1}
.hero-item-label{font-size:10px;color:rgba(255,255,255,0.55);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
.hero-item-val{font-size:16px;font-weight:800;color:#fff}
.hero-item-val.green{color:#7deb7d}
.hero-item-val.red{color:#ff8585}
.hero-cta{
  margin-top:16px;display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);
  color:#fff;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;
  cursor:pointer;transition:background .15s;text-decoration:none;
}
.hero-cta:hover{background:rgba(255,255,255,0.2)}

/* ── KPI GRID ── */
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.kpi-card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,0.06);border:1px solid var(--border);transition:transform .15s}
.kpi-card:hover{transform:translateY(-1px)}
.kpi-icon{font-size:22px;margin-bottom:8px;display:block}
.kpi-val{font-size:20px;font-weight:800;color:var(--text);line-height:1;margin-bottom:3px}
.kpi-val.green{color:var(--green)}
.kpi-val.red{color:var(--red)}
.kpi-val.gold{color:#b8860b}
.kpi-desc{font-size:11px;color:var(--muted);font-weight:500}

/* ── SECTION TITRE ── */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.section-title{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.section-link{font-size:12px;color:var(--green);font-weight:600;cursor:pointer;background:none;border:none;padding:0}
.section-link:hover{text-decoration:underline}

/* ── ALERTE CARD ── */
.alert-card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,0.06);border:1px solid var(--border);margin-bottom:14px}
.alert-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.alert-item:last-child{border-bottom:none;padding-bottom:0}
.alert-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.alert-dot.red{background:var(--red)}
.alert-dot.gold{background:var(--gold)}
.alert-dot.green{background:var(--green)}
.alert-info{flex:1}
.alert-info-title{font-size:13px;font-weight:600;color:var(--text)}
.alert-info-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.alert-amount{font-size:13px;font-weight:700;color:var(--red);white-space:nowrap}

/* ── PROCHAINE RÉUNION ── */
.next-meeting{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,0.06);border:1px solid var(--border);margin-bottom:14px;display:flex;gap:14px;align-items:center}
.next-meeting-badge{background:var(--green-light);border-radius:10px;padding:10px 12px;text-align:center;flex-shrink:0;min-width:56px}
.next-meeting-month{font-size:10px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:0.5px}
.next-meeting-day{font-size:24px;font-weight:900;color:var(--green);line-height:1}
.next-meeting-info{flex:1}
.next-meeting-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:3px}
.next-meeting-sub{font-size:12px;color:var(--muted)}
.next-meeting-tag{display:inline-block;background:var(--gold-light);color:#856404;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;margin-top:6px}

/* ── GRAPHIQUE ACTIVITÉ ── */
.chart-card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,0.06);border:1px solid var(--border);margin-bottom:14px}
.chart-bars{display:flex;align-items:flex-end;gap:6px;height:80px;margin:12px 0 4px}
.bar-group{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.bar-wrap{width:100%;display:flex;gap:2px;align-items:flex-end;justify-content:center;height:70px}
.bar{flex:1;border-radius:3px 3px 0 0;min-height:2px;transition:height .4s ease}
.bar.in{background:var(--green)}
.bar.out{background:rgba(192,57,43,0.5)}
.bar-month{font-size:9px;color:var(--muted);text-align:center;font-weight:600}
.chart-legend{display:flex;gap:14px;justify-content:flex-end;margin-bottom:4px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.legend-dot{width:8px;height:8px;border-radius:2px}

/* RESPONSIVE */
@media(max-width:600px){
  .form-row{grid-template-columns:1fr}
  .tab-content{padding:12px}
  .card{padding:14px}
  .stats-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="/app.js"></script>

<script>
// ── PWA : Service Worker + auto-update ──
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js').then(reg=>{
      // Vérifier les mises à jour toutes les 60s
      setInterval(()=>reg.update(),60000);
      reg.addEventListener('updatefound',()=>{
        const nw=reg.installing;
        nw.addEventListener('statechange',()=>{
          if(nw.state==='installed'&&navigator.serviceWorker.controller){
            // Nouvelle version disponible
            const banner=document.createElement('div');
            banner.style.cssText='position:fixed;bottom:70px;left:12px;right:12px;background:#2E6B2E;color:#fff;padding:14px 16px;border-radius:12px;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;align-items:center;gap:12px;font-family:system-ui,sans-serif;font-size:14px';
            banner.innerHTML='<span style="flex:1">🔄 Nouvelle version disponible</span><button style="background:#C8A21C;border:none;color:#1a2e1a;padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px">Mettre à jour</button>';
            banner.querySelector('button').onclick=()=>{nw.postMessage({type:'SKIP_WAITING'});location.reload()};
            document.body.appendChild(banner);
          }
        });
      });
    }).catch(e=>console.log('SW registration failed:',e));
  });
  // Recharger quand le nouveau SW prend le contrôle
  let refreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!refreshing){refreshing=true;location.reload()}
  });
}

// ── Bouton d'installation PWA ──
let deferredPrompt;
window.addEventListener('beforeinstallprompt',(e)=>{
  e.preventDefault();
  deferredPrompt=e;
  const btn=document.createElement('div');
  btn.id='pwa-install';
  btn.style.cssText='position:fixed;bottom:70px;left:12px;right:12px;background:#2E6B2E;color:#fff;padding:14px 16px;border-radius:12px;z-index:9998;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;align-items:center;gap:12px;font-family:system-ui,sans-serif;font-size:14px';
  btn.innerHTML='<span style="flex:1">📱 Installer FABAMA sur votre téléphone</span><button style="background:#C8A21C;border:none;color:#1a2e1a;padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px">Installer</button><button style="background:none;border:none;color:rgba(255,255,255,.6);font-size:20px;cursor:pointer;padding:0 4px">×</button>';
  const [install,close]=btn.querySelectorAll('button');
  install.onclick=async()=>{
    btn.remove();
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt=null;
  };
  close.onclick=()=>btn.remove();
  document.body.appendChild(btn);
});
</script>
</body>
</html>
